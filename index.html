<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Certificate Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f9f9f9;
    }
    h2 {
      color: #333;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-right: 10px;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border: 1px solid #ccc;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <h2>Certificate Verification Portal</h2>
  <p>Enter your Certificate ID (e.g., CERT-2025-001):</p>
  <input type="text" id="certId" placeholder="Enter Certificate ID">
  <button onclick="verifyCert()">Verify</button>

  <div id="result"></div>

  <script>
    async function verifyCert() {
      const certIdInput = document.getElementById("certId").value.trim().toUpperCase();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Checking...";

      try {
        const response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTsaTRg_aRp4iiAu65-ResqXMuT7HuQ6ZjmB7OsECmAup0P9fG1Dr3JPBX9RMdB8KQ9SIR2Tk8GtbRH/pub?output=csv");
        const data = await response.text();
        const rows = data.split("\n").map(row => row.split(","));

        const headers = rows[0];
        const certIdIndex = headers.indexOf("Certificate ID");
        const nameIndex = headers.indexOf("Name");
        const eventIndex = headers.indexOf("Event");
        const dateIndex = headers.indexOf("Date");

        const match = rows.find((row, index) => index > 0 && row[certIdIndex].trim() === certIdInput);

        if (match) {
          resultDiv.innerHTML = `
            <h3>✅ Certificate Found</h3>
            <p><strong>Name:</strong> ${match[nameIndex]}</p>
            <p><strong>Event:</strong> ${match[eventIndex]}</p>
            <p><strong>Date:</strong> ${match[dateIndex]}</p>
          `;
        } else {
          resultDiv.innerHTML = `<p style="color:red;">❌ Certificate ID not found. Please check and try again.</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p style="color:red;">⚠️ Error fetching data. Please try again later.</p>`;
        console.error(error);
      }
    }
  </script>

</body>
</html>
